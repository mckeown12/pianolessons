<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 1: Treble Clef Master</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --staff-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        .game-container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 700px;
            width: 100%;
        }

        h1 { margin-top: 0; color: var(--staff-color); }

        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { text-decoration: underline; }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #666;
        }

        .midi-status {
            padding: 4px 8px;
            border-radius: 4px;
            background: #eee;
            font-size: 0.8rem;
        }
        .midi-status.connected {
            background: #d4edda;
            color: #155724;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #ddd;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        button.active {
            background-color: var(--primary-color);
            color: white;
        }

        .staff-container {
            position: relative;
            height: 220px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            overflow: hidden;
        }

        svg { overflow: visible; }

        .staff-line {
            stroke: var(--staff-color);
            stroke-width: 2;
        }

        .ledger-line {
            stroke: var(--staff-color);
            stroke-width: 2;
        }

        .note-head {
            fill: #333;
            stroke: none;
            transition: fill 0.3s;
        }

        .note-stem {
            stroke: #333;
            stroke-width: 2;
        }

        .clef {
            font-size: 160px;
            font-family: serif;
            fill: var(--staff-color);
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
            line-height: 0;
        }

        .feedback {
            height: 40px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #333;
        }

        .score-board {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .piano {
            display: none;
            justify-content: center;
            position: relative;
            height: 140px;
            margin-top: 20px;
            padding: 10px;
            background: #333;
            border-radius: 5px;
            user-select: none;
        }

        .piano.visible { display: flex; }

        .key {
            width: 40px;
            height: 120px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 0 0 5px 5px;
            cursor: pointer;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            font-weight: bold;
            color: #aaa;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .key.black {
            width: 28px;
            height: 80px;
            background: #000;
            color: white;
            position: absolute;
            z-index: 2;
            border-radius: 0 0 3px 3px;
        }

        .key:active, .key.pressed {
            background: #eee;
            transform: translateY(2px);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .key.black:active, .key.black.pressed { background: #333; }

        .instructions {
            font-size: 0.9rem;
            color: #666;
            margin-top: 10px;
            min-height: 1.2em;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body>

<div class="game-container">
    <a href="index.html" class="back-link">&larr; All Lessons</a>
    <h1>Treble Clef Master</h1>

    <div class="status-bar">
        <div class="score-board">Score: <span id="score">0</span></div>
        <div id="midi-status" class="midi-status">MIDI: Not Connected</div>
    </div>

    <div class="controls">
        <button id="btn-level-1" class="active" onclick="setLevel(1)">Level 1: Type Key</button>
        <button id="btn-level-2" onclick="setLevel(2)">Level 2: Piano Keys</button>
    </div>

    <div class="feedback" id="feedback">Listen to the note...</div>

    <div class="staff-container" id="staff-area">
        <svg width="100%" height="200" viewBox="0 0 400 200">
            <line x1="50" y1="160" x2="350" y2="160" class="staff-line" />
            <line x1="50" y1="140" x2="350" y2="140" class="staff-line" />
            <line x1="50" y1="120" x2="350" y2="120" class="staff-line" />
            <line x1="50" y1="100" x2="350" y2="100" class="staff-line" />
            <line x1="50" y1="80"  x2="350" y2="80"  class="staff-line" />
            <g id="note-group">
                <line id="ledger-line" x1="180" y1="0" x2="220" y2="0" class="ledger-line" style="display:none"/>
                <ellipse id="note-head" cx="200" cy="0" rx="12" ry="10" class="note-head" />
                <line id="note-stem" x1="0" y1="0" x2="0" y2="0" class="note-stem" style="display:none" />
            </g>
        </svg>
        <div class="clef">&#119070;</div>
    </div>

    <div id="keyboard-area" class="piano"></div>

    <div class="instructions" id="instructions">
        Press the correct letter key on your keyboard (A-G) or use a MIDI keyboard.
    </div>
</div>

<script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, duration = 0.5) {
        if (!audioCtx) initAudio();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
    }

    let currentLevel = 1;
    let score = 0;
    let currentNote = null;
    let isProcessing = false;

    const notesData = [
        { name: 'C', octave: 4, freq: 261.63, y: 180, stemDown: false, ledger: true,  midi: 60 },
        { name: 'D', octave: 4, freq: 293.66, y: 170, stemDown: false, ledger: false, midi: 62 },
        { name: 'E', octave: 4, freq: 329.63, y: 160, stemDown: false, ledger: false, midi: 64 },
        { name: 'F', octave: 4, freq: 349.23, y: 150, stemDown: false, ledger: false, midi: 65 },
        { name: 'G', octave: 4, freq: 392.00, y: 140, stemDown: false, ledger: false, midi: 67 },
        { name: 'A', octave: 4, freq: 440.00, y: 130, stemDown: false, ledger: false, midi: 69 },
        { name: 'B', octave: 4, freq: 493.88, y: 120, stemDown: false, ledger: false, midi: 71 },
        { name: 'C', octave: 5, freq: 523.25, y: 110, stemDown: false, ledger: false, midi: 72 },
        { name: 'D', octave: 5, freq: 587.33, y: 100, stemDown: true,  ledger: false, midi: 74 },
        { name: 'E', octave: 5, freq: 659.25, y: 90,  stemDown: true,  ledger: false, midi: 76 },
        { name: 'F', octave: 5, freq: 698.46, y: 80,  stemDown: true,  ledger: false, midi: 77 },
        { name: 'G', octave: 5, freq: 783.99, y: 70,  stemDown: true,  ledger: false, midi: 79 },
        { name: 'A', octave: 5, freq: 880.00, y: 60,  stemDown: true,  ledger: false, midi: 81 },
        { name: 'B', octave: 5, freq: 987.77, y: 50,  stemDown: true,  ledger: false, midi: 83 },
        { name: 'C', octave: 6, freq: 1046.50,y: 40,  stemDown: true,  ledger: true,  midi: 84 }
    ];

    const noteGroup    = document.getElementById('note-group');
    const noteHead     = document.getElementById('note-head');
    const noteStem     = document.getElementById('note-stem');
    const ledgerLine   = document.getElementById('ledger-line');
    const feedbackEl   = document.getElementById('feedback');
    const scoreEl      = document.getElementById('score');
    const pianoArea    = document.getElementById('keyboard-area');
    const instructionsEl = document.getElementById('instructions');
    const btnL1        = document.getElementById('btn-level-1');
    const btnL2        = document.getElementById('btn-level-2');
    const midiStatusEl = document.getElementById('midi-status');

    function init() {
        initMIDI();
        generatePiano();
        nextNote();
        document.addEventListener('keydown', handleKeyInput);
    }

    function setLevel(level) {
        currentLevel = level;
        initAudio();
        if (level === 1) {
            btnL1.classList.add('active');
            btnL2.classList.remove('active');
            pianoArea.classList.remove('visible');
            instructionsEl.textContent = "Press the correct letter key on your keyboard (A-G) or use MIDI.";
        } else {
            btnL1.classList.remove('active');
            btnL2.classList.add('active');
            pianoArea.classList.add('visible');
            instructionsEl.textContent = "Click the piano keys or use a MIDI keyboard.";
        }
        score = 0;
        scoreEl.textContent = score;
        nextNote();
    }

    function generatePiano() {
        const layout = [
            { note: 'C',  type: 'white', midi: 60 }, { note: 'C#', type: 'black', midi: 61 },
            { note: 'D',  type: 'white', midi: 62 }, { note: 'D#', type: 'black', midi: 63 },
            { note: 'E',  type: 'white', midi: 64 },
            { note: 'F',  type: 'white', midi: 65 }, { note: 'F#', type: 'black', midi: 66 },
            { note: 'G',  type: 'white', midi: 67 }, { note: 'G#', type: 'black', midi: 68 },
            { note: 'A',  type: 'white', midi: 69 }, { note: 'A#', type: 'black', midi: 70 },
            { note: 'B',  type: 'white', midi: 71 },
            { note: 'C',  type: 'white', midi: 72 }, { note: 'C#', type: 'black', midi: 73 },
            { note: 'D',  type: 'white', midi: 74 }, { note: 'D#', type: 'black', midi: 75 },
            { note: 'E',  type: 'white', midi: 76 },
            { note: 'F',  type: 'white', midi: 77 }, { note: 'F#', type: 'black', midi: 78 },
            { note: 'G',  type: 'white', midi: 79 }, { note: 'G#', type: 'black', midi: 80 },
            { note: 'A',  type: 'white', midi: 81 }, { note: 'A#', type: 'black', midi: 82 },
            { note: 'B',  type: 'white', midi: 83 },
            { note: 'C',  type: 'white', midi: 84 }
        ];

        pianoArea.innerHTML = '';
        let whiteKeyIndex = 0;

        layout.forEach((keyData) => {
            const key = document.createElement('div');
            key.className = `key ${keyData.type}`;
            key.dataset.note = keyData.note.replace('#', '');
            key.dataset.midi = keyData.midi;

            if (keyData.type === 'white') {
                key.textContent = keyData.note;
                if (keyData.note === 'C') {
                    const octave = keyData.midi === 60 ? '4' : (keyData.midi === 72 ? '5' : '6');
                    key.textContent += octave;
                }
                whiteKeyIndex++;
            } else {
                key.style.left = `${(whiteKeyIndex * 40) - 14}px`;
            }

            if (keyData.type === 'white') {
                key.onclick = (e) => handlePianoClick(e, keyData.note);
            }

            pianoArea.appendChild(key);
        });

        pianoArea.style.width = `${whiteKeyIndex * 40 + 20}px`;
    }

    function nextNote() {
        isProcessing = false;
        feedbackEl.textContent = "Listen...";
        feedbackEl.style.color = "#333";
        noteHead.style.fill = "#333";
        noteGroup.classList.remove('shake');

        const randomIndex = Math.floor(Math.random() * notesData.length);
        currentNote = notesData[randomIndex];
        renderNoteVisuals(currentNote);

        setTimeout(() => {
            playTone(currentNote.freq, 0.8);
            feedbackEl.textContent = "What note is this?";
        }, 500);
    }

    function renderNoteVisuals(note) {
        noteHead.setAttribute('cy', note.y);
        noteStem.style.display = 'block';
        if (note.stemDown) {
            noteStem.setAttribute('x1', 200 - 12);
            noteStem.setAttribute('y1', note.y);
            noteStem.setAttribute('x2', 200 - 12);
            noteStem.setAttribute('y2', note.y + 45);
        } else {
            noteStem.setAttribute('x1', 200 + 12);
            noteStem.setAttribute('y1', note.y);
            noteStem.setAttribute('x2', 200 + 12);
            noteStem.setAttribute('y2', note.y - 45);
        }
        if (note.ledger) {
            ledgerLine.style.display = 'block';
            ledgerLine.setAttribute('y1', note.y);
            ledgerLine.setAttribute('y2', note.y);
        } else {
            ledgerLine.style.display = 'none';
        }
    }

    function handleKeyInput(e) {
        if (currentLevel !== 1 || isProcessing) return;
        const key = e.key.toUpperCase();
        if (['A','B','C','D','E','F','G'].includes(key)) checkAnswer(key);
    }

    function handlePianoClick(e, noteName) {
        if (currentLevel !== 2) return;
        const keyEl = e.target;
        keyEl.classList.add('pressed');
        setTimeout(() => keyEl.classList.remove('pressed'), 200);
        checkAnswer(noteName);
    }

    function checkAnswer(inputNote) {
        if (isProcessing) return;
        isProcessing = true;

        const inputNoteData = notesData.find(n => n.name === inputNote);
        if (inputNoteData) playTone(inputNoteData.freq, 0.4);

        if (inputNote === currentNote.name) {
            score += 10;
            scoreEl.textContent = score;
            feedbackEl.textContent = "Correct!";
            feedbackEl.style.color = "var(--success-color)";
            noteHead.style.fill = "var(--success-color)";
            setTimeout(nextNote, 1500);
        } else {
            score = Math.max(0, score - 5);
            scoreEl.textContent = score;
            feedbackEl.textContent = `You played ${inputNote}. Listen to the correct one...`;
            feedbackEl.style.color = "var(--error-color)";
            noteGroup.classList.add('shake');
            setTimeout(() => {
                playTone(currentNote.freq, 0.8);
                setTimeout(nextNote, 1500);
            }, 1000);
        }
    }

    function initMIDI() {
        if (navigator.requestMIDIAccess) {
            navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
        }
    }

    function onMIDISuccess(midiAccess) {
        midiStatusEl.textContent = "MIDI: Ready";
        midiStatusEl.classList.add('connected');
        for (let input of midiAccess.inputs.values()) {
            input.onmidimessage = getMIDIMessage;
        }
        midiAccess.onstatechange = (e) => {
            if (e.port.state === 'connected') midiStatusEl.textContent = "MIDI: Connected";
        };
    }

    function onMIDIFailure() {
        midiStatusEl.textContent = "MIDI: Error";
    }

    function getMIDIMessage(message) {
        const command  = message.data[0];
        const note     = message.data[1];
        const velocity = message.data.length > 2 ? message.data[2] : 0;
        if (command === 144 && velocity > 0) handleMIDINoteOn(note);
    }

    function handleMIDINoteOn(midiNoteNumber) {
        const noteNames = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
        const noteName  = noteNames[midiNoteNumber % 12];
        const pianoKey  = document.querySelector(`.key[data-midi="${midiNoteNumber}"]`);
        if (pianoKey) {
            pianoKey.classList.add('pressed');
            setTimeout(() => pianoKey.classList.remove('pressed'), 200);
        }
        if (!noteName.includes('#')) checkAnswer(noteName);
    }

    init();
</script>

</body>
</html>
