    <h1>Grand Staff + Key Signatures</h1>

            <text x="8" y="133" font-size="100" class="clef-symbol">&#119070;</text>
            <!-- Treble staff -->
            <line x1="50" y1="40"  x2="350" y2="40"  class="staff-line"/>
            <line x1="50" y1="60"  x2="350" y2="60"  class="staff-line"/>

            <!-- Bass clef -->
            <text x="10" y="200" font-size="50" class="clef-symbol">&#119074;</text>

            <line x1="50" y1="180" x2="350" y2="180" class="staff-line"/>

            <line x1="50" y1="220" x2="350" y2="220" class="staff-line"/>
            <line x1="50" y1="240" x2="350" y2="240" class="staff-line"/>
            <line x1="50" y1="260" x2="350" y2="260" class="staff-line"/>
            <!-- Key signature groups -->
            <g id="treble-keysig-group"></g>
            <g id="bass-keysig-group"></g>
            <!-- Treble note group -->
            <g id="treble-note-group">
                <ellipse id="treble-note-head" cx="200" cy="0" rx="12" ry="9" class="note-head"/>
                <line id="treble-note-stem" x1="0" y1="0" x2="0" y2="0" class="note-stem" style="display:none"/>
            </g>
            <!-- Bass note group -->
            <g id="bass-note-group">
                <ellipse id="bass-note-head" cx="200" cy="0" rx="12" ry="9" class="note-head"/>
                <line id="bass-note-stem" x1="0" y1="0" x2="0" y2="0" class="note-stem" style="display:none"/>
            </g>
        </svg>
    </div>

    <div class="piano-scroll"><div id="keyboard-area" class="piano"></div></div>
    <div class="instructions" id="instructions">Tap the correct piano key &mdash; check the key signature on both staves!</div>
</div>
